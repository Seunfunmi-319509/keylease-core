name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # Uploading the SARIF report is the only reason this job needs write access.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install SARIF converter
        run: cargo install clippy-sarif --locked
      # Generate the code-scanning report first, remember clippy's real exit
      # status, then upload it and fail the job on the status below. The cargo
      # invocation is the same one the gate uses, so the SARIF and the check can
      # never disagree.
      - name: cargo clippy (SARIF)
        run: |
          set -o pipefail
          status=0
          cargo clippy --all-targets --message-format=json -- -D warnings \
            | clippy-sarif > clippy.sarif || status=$?
          echo "CLIPPY_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Upload clippy SARIF
        # Fork pull requests get a read-only token, so there is nothing to
        # upload; still run for pushes, same-repo PRs and manual dispatches.
        if: always() && hashFiles('clippy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: clippy.sarif
          category: clippy
      - name: Fail on clippy warnings
        run: exit "${CLIPPY_STATUS:-1}"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `#![warn(missing_docs)]` is a rustdoc-visible lint, so this build is
      # what actually enforces documentation on public items.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all --no-deps

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all

  wasm:
    name: Build (wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build Soroban contracts
        run: cargo build --target wasm32v1-none --release --all

  deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Checks the committed Cargo.lock against deny.toml: RustSec advisories,
      # license allow-list, wildcard/git dependencies and unknown registries.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    name: Advisory Scan
    runs-on: ubuntu-latest
    # Same minimal grant as Clippy: read the checkout, write code-scanning data.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # cargo-audit emits SARIF natively. Capture the advisory result, upload
      # it, then fail the job if advisories were found.
      - name: Run advisory scan (SARIF)
        run: |
          status=0
          cargo audit --format sarif > cargo-audit.sarif || status=$?
          echo "AUDIT_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Upload advisory SARIF
        if: always() && hashFiles('cargo-audit.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cargo-audit.sarif
          category: cargo-audit
      - name: Fail on advisories
        run: exit "${AUDIT_STATUS:-1}"

  malware-scan:
    name: Malware Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The checkout only needs to be read; do not leave the job token in
      # .git/config for the scanners to read.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ClamAV
        run: |
          sudo apt-get update
          # `clamav` provides clamscan; `clamav-freshclam` provides freshclam.
          sudo apt-get install -y --no-install-recommends clamav clamav-freshclam
          # The packaged service may already be updating the signature
          # database and would hold the freshclam lock.
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          sudo pkill -f freshclam 2>/dev/null || true

      - name: Update virus signatures
        run: |
          for attempt in 1 2 3; do
            if sudo freshclam --quiet --log=/tmp/freshclam.log; then
              exit 0
            fi
            echo "freshclam attempt ${attempt} failed; retrying in 10s" >&2
            sleep 10
          done
          echo "::error::Could not download ClamAV signatures; refusing to run a stale scan"
          exit 1

      - name: Scan repository
        run: |
          set -o pipefail
          clamscan --version
          clamscan \
            --recursive \
            --infected \
            --exclude-dir='^\.git$' \
            --exclude-dir='^target$' \
            --exclude-dir='^site$' \
            --exclude-dir='^node_modules$' \
            --max-filesize=100M \
            --max-scansize=500M \
            . | tee clamav-report.txt

      # Scan the exact Wasm artifacts this repo would deploy, not just source.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build Soroban contracts
        run: cargo build --target wasm32v1-none --release --all

      - name: Scan built Wasm artifacts
        run: |
          set -o pipefail
          shopt -s nullglob
          wasm=(target/wasm32v1-none/release/*.wasm)
          if [ "${#wasm[@]}" -eq 0 ]; then
            echo "::error::No Wasm artifacts were produced"
            exit 1
          fi
          clamscan --infected "${wasm[@]}" | tee -a clamav-report.txt

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clamav-report
          path: clamav-report.txt
          if-no-files-found: ignore
